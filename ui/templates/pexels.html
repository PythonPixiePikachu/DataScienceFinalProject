<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Search Images on Pexels</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
    <style>
      body {
        background-color: #f8f9fa;
      }
      .container {
        background-color: #ffffff;
        padding: 30px;
        border-radius: 10px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        margin-top: 50px;
      }
      .btn-primary {
        background-color: #007bff;
        border-color: #007bff;
      }
      .btn-primary:hover {
        background-color: #0056b3;
        border-color: #0056b3;
      }
      .navbar {
        margin-bottom: 20px;
      }
      .image-container {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        justify-content: center;
      }
      .image-container img {
        max-width: 200px;
        cursor: pointer;
        border-radius: 5px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      }
      #loading {
        display: none;
      }
    </style>
    <script>
      function showLoading() {
        document.getElementById('loading').style.display = 'block';
      }

      function submitForm(form) {
        showLoading();
        form.submit();
      }
    </script>
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
      <a class="navbar-brand" href="#">Image Captioning</a>
      <div class="collapse navbar-collapse">
        <ul class="navbar-nav mr-auto">
          <li class="nav-item">
            <a class="nav-link" href="{{ url_for('index') }}">Home</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="{{ url_for('pexels') }}">Search Images on Pexels</a>
          </li>
        </ul>
      </div>
    </nav>
    <div class="container">
      <h1 class="text-center mt-3">Search Images on Pexels</h1>
      <form method="get" action="{{ url_for('pexels') }}" class="mt-4" onsubmit="showLoading()">
        <div class="form-group">
          <label for="query">Enter query to search images</label>
          <input type="text" class="form-control" id="query" name="query" placeholder="Search for images">
        </div>
        <div class="text-center">
          <button type="submit" class="btn btn-primary mt-2">Search</button>
        </div>
      </form>
      <div id="loading" class="text-center mt-3">
        <div class="spinner-border" role="status">
          <span class="sr-only">Loading...</span>
        </div>
        <p>Loading, please wait...</p>
      </div>
      <div class="image-container mt-4">
        {% for photo in photos %}
          <form method="post" action="{{ url_for('pexels_predict') }}" class="d-inline" onsubmit="showLoading()">
            <input type="hidden" name="image_url" value="{{ photo.src.original }}">
            <img src="{{ photo.src.medium }}" alt="{{ photo.alt }}" class="img-thumbnail" onclick="submitForm(this.parentElement);">
          </form>
        {% endfor %}
      </div>
      {% if image_url %}
        <div class="mt-5 text-center">
          <h2>Selected Image</h2>
          <img src="{{ image_url }}" class="img-fluid mt-3" alt="Selected Image" style="max-width: 100%; height: 400px;">
          <h3 class="mt-3">Caption: {{ caption }}</h3>
        </div>
      {% endif %}
    </div>
  </body>
</html>
