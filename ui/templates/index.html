<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Image Captioning</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
    <style>
      body {
        background-color: #f8f9fa;
      }
      .container {
        background-color: #ffffff;
        padding: 30px;
        border-radius: 10px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        margin-top: 50px;
      }
      .btn-primary {
        background-color: #007bff;
        border-color: #007bff;
      }
      .btn-primary:hover {
        background-color: #0056b3;
        border-color: #0056b3;
      }
      .navbar {
        margin-bottom: 20px;
      }
      #loading {
        display: none;
      }
    </style>
    <script>
      function showLoading() {
        document.getElementById('loading').style.display = 'block';
      }
    </script>
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
      <a class="navbar-brand" href="#">Image Captioning</a>
      <div class="collapse navbar-collapse">
        <ul class="navbar-nav mr-auto">
          <li class="nav-item">
            <a class="nav-link" href="{{ url_for('index') }}">Home</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="{{ url_for('pexels') }}">Search Images on Pexels</a>
          </li>
        </ul>
      </div>
    </nav>
    <div class="container">
      <h1 class="text-center mt-3">Upload an Image for Captioning</h1>
      <form method="post" enctype="multipart/form-data" class="mt-4" onsubmit="showLoading()">
        <div class="form-group">
          <label for="file">Choose image to upload</label>
          <input type="file" class="form-control-file" id="file" name="file">
        </div>
        <div class="text-center">
          <button type="submit" class="btn btn-primary mt-2">Upload</button>
        </div>
      </form>
      <div id="loading" class="text-center mt-3">
        <div class="spinner-border" role="status">
          <span class="sr-only">Loading...</span>
        </div>
        <p>Loading, please wait...</p>
      </div>
      {% if filename %}
        <div class="mt-5 text-center">
          <h2>Uploaded Image</h2>
          <img src="{{ url_for('uploaded_file', filename=filename) }}" class="img-fluid mt-3" alt="Uploaded Image" style="max-width: 100%; height: auto;">
          <h3 class="mt-3">Caption: {{ caption }}</h3>
        </div>
      {% endif %}
    </div>
  </body>
</html>
